services:
  proxmox-gateway:
    build: .
    container_name: proxmox-mcp-gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional Cloudflare Tunnel sidecar for secure edge routing without public port-forwarding
